[effect]
id = "concat.full-voice"
name = "Full Voice"
kind = "audio"
category = "Tone"
order = 67
intensity = "amount"
description = "A rich, rounded voice from low to high."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "equalizer=f=120:t=q:w=1:g={fixed(amount / 100 * 3, 1)},equalizer=f=1000:t=q:w=1:g={fixed(amount / 100 * 1.5, 1)},equalizer=f=6000:t=q:w=1.5:g={fixed(amount / 100 * 1.5, 1)},acompressor=threshold={fixed(0.5 - amount / 100 * 0.2, 2)}:ratio={fixed(2 + amount / 100 * 1.5, 1)}:attack=15:release=120,alimiter=limit=0.95"
