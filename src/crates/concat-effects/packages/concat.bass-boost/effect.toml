[effect]
id = "concat.bass-boost"
name = "Bass Boost"
kind = "audio"
category = "Tone"
order = 65
intensity = "amount"
description = "A big, clean low end."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "bass=g={fixed(amount / 100 * 10, 1)}:f=100:w=0.6,alimiter=limit=0.95"
