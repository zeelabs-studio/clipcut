[effect]
id = "concat.big-house"
name = "Big House"
kind = "audio"
category = "Space"
order = 69
intensity = "amount"
description = "A large hall around the voice."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "aecho=0.8:0.9:{fixed(40 + amount / 100 * 80, 0)}|{fixed(90 + amount / 100 * 160, 0)}|{fixed(150 + amount / 100 * 250, 0)}:{fixed(0.2 + amount / 100 * 0.2, 2)}|{fixed(0.15 + amount / 100 * 0.15, 2)}|{fixed(0.1 + amount / 100 * 0.1, 2)},alimiter=limit=0.95"
