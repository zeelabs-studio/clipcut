[effect]
id = "concat.studio-mic"
name = "Studio Mic"
kind = "audio"
category = "Tone"
order = 68
intensity = "amount"
description = "A treated-room sound: tidy, present, controlled."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "highpass=f=80,afftdn=nf={fixed(0 - 25 - amount / 100 * 10, 1)}:nr={fixed(6 + amount / 100 * 10, 1)},equalizer=f=200:t=q:w=1:g={fixed(0 - amount / 100 * 2, 1)},equalizer=f=5000:t=q:w=1.5:g={fixed(amount / 100 * 2, 1)},deesser=i={fixed(amount / 100 * 0.3, 2)},acompressor=threshold={fixed(0.5 - amount / 100 * 0.2, 2)}:ratio={fixed(2 + amount / 100 * 1.5, 1)}:attack=15:release=120,alimiter=limit=0.95"
