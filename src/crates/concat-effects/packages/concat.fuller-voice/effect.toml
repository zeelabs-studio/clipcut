[effect]
id = "concat.fuller-voice"
name = "Fuller Voice"
kind = "audio"
category = "Tone"
order = 64
intensity = "amount"
description = "Body and warmth for a thin recording."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "equalizer=f=160:t=q:w=1.2:g={fixed(amount / 100 * 4, 1)},equalizer=f=400:t=q:w=1.2:g={fixed(amount / 100 * 2, 1)},acompressor=threshold={fixed(0.5 - amount / 100 * 0.2, 2)}:ratio={fixed(2 + amount / 100 * 1.5, 1)}:attack=15:release=120,alimiter=limit=0.95"
