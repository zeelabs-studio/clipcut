format = 2

[effect]
id = "concat.hd-cam"
name = "HD Cam"
kind = "filter"
category = "HD"
order = 4
intensity = "amount"
description = "A clean, natural camera look."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "sharp"
label = "Sharpness"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
