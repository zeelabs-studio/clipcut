[effect]
id = "concat.bass-mic"
name = "Bass Mic"
kind = "audio"
category = "Tone"
order = 61
intensity = "amount"
description = "The warm, close low end of a radio mic."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "highpass=f=60,equalizer=f=120:t=q:w=1:g={fixed(amount / 100 * 8, 1)},equalizer=f=3000:t=q:w=1.5:g={fixed(amount / 100 * 1.5, 1)},acompressor=threshold={fixed(0.5 - amount / 100 * 0.2, 2)}:ratio={fixed(2 + amount / 100 * 1.5, 1)}:attack=15:release=120,alimiter=limit=0.95"
