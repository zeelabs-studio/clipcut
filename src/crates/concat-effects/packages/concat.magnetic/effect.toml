[effect]
id = "concat.magnetic"
name = "Magnetic"
kind = "audio"
category = "Tone"
order = 73
intensity = "amount"
description = "A deep, smooth, pulled-in voice."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "equalizer=f=120:t=q:w=1:g={fixed(amount / 100 * 4, 1)},equalizer=f=800:t=q:w=1:g={fixed(0 - amount / 100 * 2, 1)},equalizer=f=3500:t=q:w=1.5:g={fixed(amount / 100 * 3, 1)},acompressor=threshold={fixed(0.5 - amount / 100 * 0.2, 2)}:ratio={fixed(2 + amount / 100 * 1.5, 1)}:attack=15:release=120,alimiter=limit=0.95"
